# Ephemeral Redis for the signaling relay. Rooms live for at most five
# minutes, so persistence is intentionally disabled.
#
# Usage:
#   export REDIS_PASSWORD="$(openssl rand -hex 24)"
#   docker compose -f deploy/docker-compose.yml up -d
#   export E2EE_REDIS_PASSWORD="$REDIS_PASSWORD"
services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped
