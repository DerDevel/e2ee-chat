before:
  hooks:
    - go mod tidy

builds:
  - id: e2ee-chat-client
    main: ./client
    binary: e2ee-chat-client
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  extra_files:
    - glob: ./install.sh

nfpms:
  - id: e2ee-chat-client-deb
    package_name: e2ee-chat-client
    vendor: DerDevel
    homepage: https://github.com/DerDevel/e2ee-chat
    maintainer: DerDevel
    description: "E2EE chat client"
    license: MIT
    formats:
      - deb
    bindir: /usr/bin
    contents:
      - src: ./install.sh
        dst: /usr/share/e2ee-chat-client/install.sh
